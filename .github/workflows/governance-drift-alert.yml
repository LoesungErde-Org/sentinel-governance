name: Governance Drift Alert
permissions:
  contents: read
jobs:
  governance-drift-alert:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - name: Run governance drift check
      id: drift
      shell: bash
      run: |
        set +e
        python tools/check_governance_drift.py --repo . --json-out governance/drift-report.json --md-out governance/drift-report.md
        RC=$?
        echo "exit_code=$RC" >> "$GITHUB_OUTPUT"
        exit 0
    - name: Add drift report to step summary
      shell: bash
      run: |
        cat governance/drift-report.md >> "$GITHUB_STEP_SUMMARY"
    - name: Upload drift reports
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: governance-drift-report
        path: |
          governance/drift-report.json
          governance/drift-report.md
    - name: Enforce drift gate
      shell: bash
      run: |
        RC='${{ steps.drift.outputs.exit_code }}'
        if [ "$RC" = "2" ]; then
          echo "Critical governance drift detected (exit 2). CAB escalation required."
          exit 2
        fi
        if [ "$RC" = "1" ]; then
          echo "Governance drift detected (exit 1). Blocking this run."
          exit 1
        fi
        echo "No governance drift detected."
    timeout-minutes: 20
'on':
  pull_request:
    branches:
    - main
    paths:
    - .github/CODEOWNERS
    - .github/workflows/**
    - governance/**
    - tools/**
  schedule:
  - cron: 0 6 * * 1
  workflow_dispatch: null
